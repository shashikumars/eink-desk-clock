; E-Ink desk clock — FireBeetle 2 ESP32-S3 (DFR1145, N4) + Waveshare 7.5" e-Paper HAT (B), black/white/red
;
; First upload:  plug in USB-C, then PlatformIO toolbar -> "Upload" (env: usb)
; Later uploads: over Wi-Fi, PlatformIO sidebar -> env "ota" -> Upload

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; DFR1145 has 4 MB flash and no PSRAM (the devkitc-1 profile assumes 8 MB)
board_upload.flash_size = 4MB
; Two ~1.9 MB app slots so over-the-air updates work
board_build.partitions = min_spiffs.csv

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; The photo test program lives in src/photo/ and is left out of the clock build
build_src_filter = +<*> -<photo/>

lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    bblanchon/ArduinoJson@^7.0.0
    tzapu/WiFiManager@^2.0.17

[env:usb]
upload_speed = 921600

; Photo test: shows src/photo/photo_data.h once (make it with tools/make-photo.cjs).
; Upload "usb" again to get the clock back.
[env:photo]
upload_speed = 921600
build_src_filter = +<epd.cpp> +<photo/>

[env:ota]
upload_protocol = espota
upload_port = eink-clock.local
